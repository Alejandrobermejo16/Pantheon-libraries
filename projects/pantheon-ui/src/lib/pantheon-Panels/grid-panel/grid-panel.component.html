<div class="grid-panel" [ngStyle]="{'grid-template-columns': gridTemplateColumns}">
  <div class="grid-column" *ngFor="let column of dataColumns; let columnIndex = index"
       cdkDropList
       [id]="'column-' + columnIndex"
       [cdkDropListData]="column.items"
       [cdkDropListConnectedTo]="connectedDropLists"
       (cdkDropListDropped)="onTaskDrop($event, columnIndex)">

    <div class="column-content">
      <div *ngFor="let item of column.items; trackBy: trackById"
           cdkDrag
           [cdkDragData]="item"
           [cdkDragDisabled]="currentUserEmail !== '' && item.userEmail !== currentUserEmail">
        <ng-container
          *ngTemplateOutlet="itemTemplate; context: { $implicit: item, columnIndex: columnIndex }">
        </ng-container>
      </div>
    </div>
  </div>
</div>
